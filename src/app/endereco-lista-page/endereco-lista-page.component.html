<div class="cabecalho">
  <h2>Endereços</h2>
  <button mat-raised-button color="primary" (click)="novoEndereco()">Novo endereço</button>
</div>

<div class="pagina">
  <table mat-table [dataSource]="enderecos" class="tabela">
    <ng-container matColumnDef="rua">
      <th mat-header-cell *matHeaderCellDef>Rua</th>
      <td mat-cell *matCellDef="let endereco">{{ endereco.rua }}, {{ endereco.numero }}</td>
    </ng-container>

    <ng-container matColumnDef="bairro">
      <th mat-header-cell *matHeaderCellDef>Bairro</th>
      <td mat-cell *matCellDef="let endereco">{{ endereco.bairro }}</td>
    </ng-container>

    <ng-container matColumnDef="cidade">
      <th mat-header-cell *matHeaderCellDef>Cidade</th>
      <td mat-cell *matCellDef="let endereco">{{ endereco.cidade }}</td>
    </ng-container>

    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef>UF</th>
      <td mat-cell *matCellDef="let endereco">{{ endereco.estado }}</td>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let endereco">
        <button mat-icon-button (click)="editarEndereco(endereco)" aria-label="Editar">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr mat-row *matRowDef="let row; columns: colunas;"></tr>
  </table>
</div>
