<mat-toolbar color="primary" class="header-recibo">
  <div class="info">
    <div class="logo">
      <mat-icon>home</mat-icon>
    </div>

    <div class="texto">
      <span class="corretor">Corretor {{ corretor }}</span>
      <span class="slogan">{{ slogan }}</span>
      <span class="creci">CRECI - {{ creci }}</span>
    </div>
  </div>

  <div class="datas" [formGroup]="form">
    <mat-form-field appearance="outline">
      <mat-label>Data de pagamento</mat-label>
      <input matInput type="date" formControlName="dataPagamento">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Data do reajuste</mat-label>
      <input matInput type="date" formControlName="dataReajuste">
    </mat-form-field>
  </div>
</mat-toolbar>
