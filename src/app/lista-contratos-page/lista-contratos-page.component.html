<div class="cabecalho">
  <h2>Contratos</h2>
  <button mat-raised-button color="primary" (click)="novoContrato()">Novo contrato</button>
</div>

<div class="pagina">
  <table mat-table [dataSource]="contratos" class="tabela">
    <ng-container matColumnDef="inquilinoNome">
      <th mat-header-cell *matHeaderCellDef>Inquilino</th>
      <td mat-cell *matCellDef="let contrato">{{ contrato.inquilinoNome }}</td>
    </ng-container>

    <ng-container matColumnDef="proprietarioNome">
      <th mat-header-cell *matHeaderCellDef>Proprietário</th>
      <td mat-cell *matCellDef="let contrato">{{ contrato.proprietarioNome }}</td>
    </ng-container>

    <ng-container matColumnDef="endereco">
      <th mat-header-cell *matHeaderCellDef>Endereço do imóvel</th>
      <td mat-cell *matCellDef="let contrato">{{ formatarEndereco(contrato) }}</td>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let contrato">
        <button mat-icon-button (click)="emitirRecibo(contrato)" aria-label="Emitir recibo" title="Emitir recibo">
          <mat-icon>receipt_long</mat-icon>
        </button>
        <button mat-icon-button (click)="editarContrato(contrato)" aria-label="Editar" title="Editar">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr mat-row *matRowDef="let row; columns: colunas;"></tr>
  </table>

  @if (contratos.length === 0) {
    <p>Nenhum contrato encontrado.</p>
  }
</div>
